name: stronzflix
description: "Streaming application."
publish_to: 'none'

version: 0.2.14

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
      sdk: flutter
  async: ^2.11.0
  background_downloader: ^8.5.3
  cast: ^2.1.0
  crypto: ^3.0.3
  ffmpeg_kit_flutter: ^6.0.3
  flutter_hls_parser:
    git: https://github.com/Bonfra04/flutter_hls_parser.git
  flutter_svg: ^2.0.10+1
  html: ^0.15.4
  html_unescape: ^2.0.0
  path_provider: ^2.1.3
  peerdart: ^0.5.4
  process_run: ^1.2.2+1
  shimmer: ^3.0.0
  url_launcher: ^6.2.6
  uuid: ^4.4.0
  js_unpack: ^1.0.4
  auto_size_text: ^3.0.0
  provider: ^6.1.2
  encrypt: ^5.0.3
  stronz_video_player:
    git: https://github.com/StronzLabs/StronzVideoPlayer.git
  sutils:
    git: https://github.com/StronzLabs/SUtils.git
  castscreen:
    git: https://github.com/Bonfra04/dart_castscreen.git

  # needed to make the shared library be embedded in the application
  fvp:
    git: https://github.com/wang-bin/fvp.git

dependency_overrides:
  uuid: ^4.4.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  test: any

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.svg
