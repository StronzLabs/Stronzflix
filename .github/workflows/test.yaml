name: Test
on: 
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Run on Windows'
        type: boolean
        required: true
        default: true
      build_linux:
        description: 'Run on Linux'
        type: boolean
        required: true
        default: true
      build_macos:
        description: 'Run on MacOS'
        type: boolean
        required: true
        default: true
      build_android:
        description: 'Run on Android'
        type: boolean
        required: true
        default: true
jobs:
  integration-tests:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      
      - name: Download Java
        uses: actions/setup-java@v2
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Download Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.1"
          channel: "stable"
          cache: false
          architecture: x64

      - name: Run tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          target: playstore
          api-level: 33
          arch: arm64-v8a
          profile: Nexus 6
          script: flutter test -d emulator
